name: Lint Backend

on:
  push:
    paths:
      - "backend-django/**"
      - "backend-fastapi/**"
  pull_request:
    paths:
      - "backend-django/**"
      - "backend-fastapi/**"

jobs:
  lint-django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend-django
        run: |
          pip install ruff mypy
          pip install -r requirements.txt
      - name: Ruff
        working-directory: backend-django
        run: ruff check .

  lint-fastapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend-fastapi
        run: |
          pip install ruff mypy
          pip install -r requirements.txt
      - name: Ruff
        working-directory: backend-fastapi
        run: ruff check .
